name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ctec_test
          POSTGRES_USER: ctec
          POSTGRES_PASSWORD: ctec
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ctec -d ctec_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CTEC_TEST_DATABASE_URL: postgresql+psycopg://ctec:ctec@localhost:5432/ctec_test
      CTEC_DATABASE_URL: postgresql+psycopg://ctec:ctec@localhost:5432/ctec_test
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e '.[dev]'
      - run: black --check .
      - run: isort --check-only .
      - run: ruff check .
      - run: mypy app
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run --coverage
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    env:
      CTEC_RUNTIME_HANDOFF_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CTEC_KEYCLOAK_ADMIN_PASSWORD: ci-only-placeholder-admin-password
      CTEC_DEMO_USER_PASSWORD: ci-only-placeholder-demo-password
      COMPOSE_PROJECT_NAME: ctec-ci
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build

      # Fresh state only: a fresh checkout has no pre-existing volumes, and
      # the explicit project name plus the final teardown step below (which
      # always runs, including on failure) guarantee no reused Postgres/
      # Keycloak state leaks between runs.
      - name: Boot the real stack from a fresh state
        run: docker compose up -d

      - name: Wait for Postgres, Keycloak, and backend to report healthy
        run: |
          set -eu
          for svc in postgres keycloak backend; do
            echo "waiting for $svc to become healthy..."
            ok=""
            for i in $(seq 1 90); do
              cid=$(docker compose ps -q "$svc")
              status=$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then ok=1; echo "$svc: healthy"; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "$svc did not become healthy in time"
              docker compose logs "$svc"
              exit 1
            fi
          done

      # Not a Docker-I authorization: docker-compose.yml's own frontend
      # healthcheck (unmodified, out of scope for this phase) runs `wget
      # http://localhost:3000` *inside* the container, but Docker auto-sets
      # HOSTNAME to the container ID and Next.js's standalone server.js
      # honors that as its bind address -- so it never binds loopback and
      # the container-internal healthcheck can never pass, even though the
      # published port works correctly from any real external caller
      # (proven directly: `docker inspect` shows the process bound only to
      # the container's own bridge IP, never 0.0.0.0/127.0.0.1). This is a
      # pre-existing packaging defect, unrelated to OQI/Keycloak/Docker-I,
      # and outside this phase's frozen four-path authorization to fix.
      # Proving frontend reachability the same way a real browser or
      # Docker-VM reviewer would -- the published port from the runner --
      # is therefore used here instead of the container's own (currently
      # unreliable) health status.
      - name: Wait for frontend to respond on its published port
        run: |
          set -eu
          ok=""
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000 || echo "000")
            if [ "$code" = "200" ]; then ok=1; echo "frontend: responding (200)"; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "frontend did not respond in time"
            docker compose logs frontend
            exit 1
          fi

      - name: Wait for the one-shot Keycloak demo-user bootstrap to complete
        run: |
          set -eu
          ok=""
          for i in $(seq 1 60); do
            cid=$(docker compose ps -aq keycloak-bootstrap)
            # A freshly-created-but-not-yet-run container also reports
            # ExitCode=0 as its zero value -- Status must genuinely be
            # "exited" too, or this races the container actually running.
            rstatus=$(docker inspect --format='{{.State.Status}}' "$cid" 2>/dev/null || echo "")
            code=$(docker inspect --format='{{.State.ExitCode}}' "$cid" 2>/dev/null || echo "")
            if [ "$rstatus" = "exited" ] && [ "$code" = "0" ]; then
              ok=1; echo "keycloak-bootstrap: completed"; break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "keycloak-bootstrap did not complete successfully"
            docker compose logs keycloak-bootstrap
            exit 1
          fi

      - name: Verify the fresh database reached the authoritative migration head
        run: |
          set -eu
          head=$(docker compose exec -T -e PGPASSWORD=ctec postgres psql -U ctec -d ctec -tAc "SELECT version_num FROM alembic_version")
          echo "migration head: $head"
          [ "$head" = "0026_oqi6_reliance" ] || { echo "unexpected migration head: $head"; exit 1; }

      - name: Verify the fresh schema has exactly the expected table count
        run: |
          set -eu
          count=$(docker compose exec -T -e PGPASSWORD=ctec postgres psql -U ctec -d ctec -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' AND table_name != 'alembic_version'")
          echo "table count: $count"
          [ "$count" -eq 100 ] || { echo "unexpected table count: $count (expected 100)"; exit 1; }

      - name: Verify the imported Keycloak realm exposes exactly the required OQI scopes, correctly classified
        run: |
          set -eu
          admin_token=$(curl -sf -X POST "http://localhost:8081/realms/master/protocol/openid-connect/token" \
            -d "client_id=admin-cli" -d "grant_type=password" \
            -d "username=admin" -d "password=$CTEC_KEYCLOAK_ADMIN_PASSWORD" | jq -r .access_token)
          client_uuid=$(curl -sf -H "Authorization: Bearer $admin_token" \
            "http://localhost:8081/admin/realms/CTEC/clients?clientId=ctec-frontend" | jq -r '.[0].id')
          default_scopes=$(curl -sf -H "Authorization: Bearer $admin_token" \
            "http://localhost:8081/admin/realms/CTEC/clients/$client_uuid/default-client-scopes" | jq -r '.[].name')
          optional_scopes=$(curl -sf -H "Authorization: Bearer $admin_token" \
            "http://localhost:8081/admin/realms/CTEC/clients/$client_uuid/optional-client-scopes" | jq -r '.[].name')
          echo "default scopes: $default_scopes"
          echo "optional scopes: $optional_scopes"
          echo "$default_scopes" | grep -qx "oqi:read" || { echo "oqi:read is not a default scope"; exit 1; }
          echo "$optional_scopes" | grep -qx "oqi-remediation:authorize" || { echo "oqi-remediation:authorize is not an optional scope"; exit 1; }
          echo "$optional_scopes" | grep -qx "oqi-remediation:report-execution" || { echo "oqi-remediation:report-execution is not an optional scope"; exit 1; }
          if echo "$default_scopes" | grep -qx "oqi-remediation:authorize"; then echo "oqi-remediation:authorize must not be default"; exit 1; fi
          if echo "$default_scopes" | grep -qx "oqi-remediation:report-execution"; then echo "oqi-remediation:report-execution must not be default"; exit 1; fi

      - name: Backend process liveness
        run: curl -sf http://localhost:8000/health

      - name: Frontend production container responds
        run: curl -sf -o /dev/null http://localhost:3000

      - name: Unauthenticated OQI request fails closed
        run: |
          set -eu
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/oqi/command-center)
          [ "$code" = "401" ] || { echo "expected 401 for an unauthenticated OQI request, got $code"; exit 1; }

      - name: Authenticated OQI read via the real governed login flow (no direct-grant shortcut)
        run: |
          set -eu
          # ctec-frontend deliberately disables direct access grants (a real
          # security property, never weakened for CI convenience). This
          # simulates the exact Authorization Code + PKCE flow a real
          # browser performs against the real login form -- never a
          # shortcut grant type, never a bypass.
          VERIFIER=$(openssl rand -base64 96 | tr -dc 'A-Za-z0-9' | cut -c1-64)
          CHALLENGE=$(printf '%s' "$VERIFIER" | openssl dgst -sha256 -binary | openssl base64 | tr '+/' '-_' | tr -d '=')
          COOKIES=$(mktemp)
          SCOPE="openid profile oqi:read oqi-remediation:authorize oqi-remediation:report-execution"

          AUTH_PAGE=$(curl -sS -c "$COOKIES" -G "http://localhost:8081/realms/CTEC/protocol/openid-connect/auth" \
            --data-urlencode "client_id=ctec-frontend" \
            --data-urlencode "response_type=code" \
            --data-urlencode "scope=$SCOPE" \
            --data-urlencode "redirect_uri=http://localhost:3000/auth/callback" \
            --data-urlencode "code_challenge=$CHALLENGE" \
            --data-urlencode "code_challenge_method=S256")
          ACTION=$(printf '%s' "$AUTH_PAGE" | grep -o 'action="[^"]*login-actions/authenticate[^"]*"' | head -1 \
            | sed -e 's/^action="//' -e 's/"$//' -e 's/\&amp;/\&/g')
          [ -n "$ACTION" ] || { echo "could not locate the Keycloak login form action"; echo "$AUTH_PAGE"; exit 1; }

          LOGIN_RESPONSE=$(curl -sS -i -c "$COOKIES" -b "$COOKIES" \
            --data-urlencode "username=ctec-demo-user" \
            --data-urlencode "password=$CTEC_DEMO_USER_PASSWORD" \
            "$ACTION")
          CODE=$(printf '%s' "$LOGIN_RESPONSE" | tr -d '\r' | grep -i '^location:' | grep -o 'code=[^&[:space:]]*' | head -1 | cut -d= -f2)
          [ -n "$CODE" ] || { echo "real login did not yield an authorization code"; echo "$LOGIN_RESPONSE"; exit 1; }

          TOKEN_RESPONSE=$(curl -sS -X POST "http://localhost:8081/realms/CTEC/protocol/openid-connect/token" \
            --data-urlencode "grant_type=authorization_code" \
            --data-urlencode "client_id=ctec-frontend" \
            --data-urlencode "code=$CODE" \
            --data-urlencode "redirect_uri=http://localhost:3000/auth/callback" \
            --data-urlencode "code_verifier=$VERIFIER")
          ACCESS_TOKEN=$(printf '%s' "$TOKEN_RESPONSE" | jq -r .access_token)
          [ "$ACCESS_TOKEN" != "null" ] && [ -n "$ACCESS_TOKEN" ] || { echo "token exchange failed: $TOKEN_RESPONSE"; exit 1; }
          rm -f "$COOKIES"

          PAYLOAD=$(printf '%s' "$ACCESS_TOKEN" | cut -d. -f2 | tr '_-' '/+')
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          for _ in $(seq 1 "$PAD"); do PAYLOAD="${PAYLOAD}="; done
          TOKEN_SCOPES=$(printf '%s' "$PAYLOAD" | base64 -d | jq -r .scope)
          echo "issued token scopes: $TOKEN_SCOPES"
          for scope in oqi:read oqi-remediation:authorize oqi-remediation:report-execution; do
            echo "$TOKEN_SCOPES" | grep -qw "$scope" || { echo "issued token is missing scope: $scope"; exit 1; }
          done

          # /health is process liveness only, not a DB-readiness check (frozen,
          # unchanged) -- the backend's own DB connection pool can still be
          # warming up for a moment after /health first reports healthy.
          # Retry briefly rather than fail on that transient startup window;
          # this still requires a genuine 200 within a few seconds, never a
          # weakened assertion.
          ok=""
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" http://localhost:8000/api/v1/oqi/command-center)
            [ "$code" = "200" ] && { ok=1; break; }
            echo "attempt $i: authenticated OQI read returned HTTP $code, retrying..."
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "authenticated OQI read failed: HTTP $code"
            echo "--- diagnostic: backend's own CTEC_DATABASE_URL and settings ---"
            docker compose exec -T backend env | grep -i CTEC_DATABASE || echo "(CTEC_DATABASE_URL not set in container env)"
            docker compose exec -T backend python -c "from app.core.config import get_settings; s = get_settings(); print('database_url is None:', s.database_url is None)"
            docker compose logs backend
            exit 1
          fi
          echo "authenticated OQI read: 200 OK; oqi:read plus both optional OQI remediation scopes were genuinely issued"

      - name: Seed the deterministic OQI demo-showcase foundation (idempotent, demo tenant only)
        run: docker compose exec -T backend python -m app.infrastructure.persistence.demo_oqi_seeder

      - name: Confirm no paid-model dependency was required for any of the above
        run: |
          [ -z "${ANTHROPIC_API_KEY:-}" ] || { echo "ANTHROPIC_API_KEY unexpectedly set"; exit 1; }
          [ -z "${OPENAI_API_KEY:-}" ] || { echo "OPENAI_API_KEY unexpectedly set"; exit 1; }
          echo "stack booted, migrated, authenticated, and served a real OQI read/seed with no model API key present"

      - name: Tear down containers, networks, and volumes
        if: always()
        run: docker compose down -v --remove-orphans
