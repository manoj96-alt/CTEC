name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ctec_test
          POSTGRES_USER: ctec
          POSTGRES_PASSWORD: ctec
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ctec -d ctec_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CTEC_TEST_DATABASE_URL: postgresql+psycopg://ctec:ctec@localhost:5432/ctec_test
      CTEC_DATABASE_URL: postgresql+psycopg://ctec:ctec@localhost:5432/ctec_test
    defaults: { run: { working-directory: cognitive-engine/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cognitive-engine/backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: black --check .
      - run: isort --check-only .
      - run: ruff check .
      - run: mypy app
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cognitive-engine/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cognitive-engine/frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run --coverage
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
