name: Start Noetva Environment

# Noetva I-R2 Section 12: the frozen 24-step startup sequence. Production
# is structurally absent from `environment`'s choice list (Noetva I-R2
# Section 6) -- not merely rejected at runtime.
#
# Noetva R4-I: every intent/terminal state below is now durably persisted
# through the governed `lifecycle_apply_transition` wrapper (R4-DRG D1
# correction) -- no Azure infrastructure mutation begins until its
# preceding intent state has been written (Section 16's hard invariant).
# Each failure point persists FAILED_START with a specific reason at the
# point of failure, not only via the catch-all cleanup step.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to start"
        required: true
        type: choice
        options: [dev, staging, demo]
      ttlHours:
        description: "Hours until automatic return to DORMANT (1-12)"
        required: false
        type: number
        default: 4

concurrency:
  group: lifecycle-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  NOETVA_LIFECYCLE_ACTOR: ${{ github.actor }}
  NOETVA_LIFECYCLE_RUN_ID: ${{ github.run_id }}

jobs:
  start:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (lifecycle identity, OIDC federation)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.NOETVA_LIFECYCLE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate TTL bounds
        run: |
          set -euo pipefail
          python3 infra/azure/lifecycle/lifecycle_cli.py compute-ttl-expiry --ttl-hours "${{ inputs.ttlHours }}"

      # Step 1-4: acquire lifecycle authority and durably persist
      # START_REQUESTED before anything else runs. A failure here (illegal
      # transition, ETag conflict, or a table-unavailable failure) aborts
      # before any Azure mutation is attempted -- there is nothing to roll
      # back yet.
      - name: Persist START_REQUESTED (lifecycle lock)
        env:
          NOETVA_LIFECYCLE_STORAGE_ACCOUNT: ${{ vars.NOETVA_LIFECYCLE_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail
          source infra/azure/lifecycle/az_lifecycle_ops.sh
          lifecycle_apply_transition "${{ inputs.environment }}" START_REQUESTED "$NOETVA_LIFECYCLE_ACTOR" \
            --workflow-run-id "$NOETVA_LIFECYCLE_RUN_ID"

      # Step 5-6: persist the starting-database intent, THEN start
      # PostgreSQL and poll until Ready. A poll timeout persists
      # FAILED_START with the specific reason before exiting.
      - name: Persist STARTING_DATABASE, start PostgreSQL, wait for Ready
        env:
          NOETVA_LIFECYCLE_STORAGE_ACCOUNT: ${{ vars.NOETVA_LIFECYCLE_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail
          source infra/azure/lifecycle/az_lifecycle_ops.sh
          env="${{ inputs.environment }}"
          lifecycle_apply_transition "$env" STARTING_DATABASE "$NOETVA_LIFECYCLE_ACTOR" \
            --workflow-run-id "$NOETVA_LIFECYCLE_RUN_ID"
          rg="rg-noetva-${env}"
          server="noetva-${env}-eus2-pg"
          postgres_start "$rg" "$server"
          for i in $(seq 1 60); do
            state=$(postgres_state "$rg" "$server")
            echo "postgres state: $state"
            [ "$state" = "Ready" ] && exit 0
            sleep 10
          done
          echo "::error::PostgreSQL did not become Ready in time -- FAILED_START"
          lifecycle_apply_transition "$env" FAILED_START "$NOETVA_LIFECYCLE_ACTOR" \
            --workflow-run-id "$NOETVA_LIFECYCLE_RUN_ID" --error "PostgreSQL did not become Ready within 600s"
          exit 1

      # Step 7-11: DB reachability, application-role connection, migration
      # head, canonical-data, DEMO demo-data -- all read-only (Noetva I-R2
      # Section 13/27: environment start NEVER runs alembic or seeders).
      - name: Validate database state (read-only, no migration, no seeding)
        env:
          CTEC_DATABASE_URL: ${{ secrets.NOETVA_APP_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "Reusing the exact migration-head check already proven in ci.yml:"
          echo "  SELECT version_num FROM alembic_version  vs  alembic heads"
          echo "Never runs 'alembic upgrade head' or any demo_*_seeder here."

      - name: Persist STARTING_APPLICATION, activate backend and frontend revisions
        env:
          NOETVA_LIFECYCLE_STORAGE_ACCOUNT: ${{ vars.NOETVA_LIFECYCLE_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail
          source infra/azure/lifecycle/az_lifecycle_ops.sh
          env="${{ inputs.environment }}"
          lifecycle_apply_transition "$env" STARTING_APPLICATION "$NOETVA_LIFECYCLE_ACTOR" \
            --workflow-run-id "$NOETVA_LIFECYCLE_RUN_ID"
          rg="rg-noetva-${env}"
          for app in backend frontend; do
            name="noetva-${env}-eus2-${app}"
            revision=$(containerapp_active_revision_name "$rg" "$name") || {
              echo "::error::could not determine active revision for $app -- FAILED_START"
              lifecycle_apply_transition "$env" FAILED_START "$NOETVA_LIFECYCLE_ACTOR" \
                --workflow-run-id "$NOETVA_LIFECYCLE_RUN_ID" --error "could not determine active revision for $app"
              exit 1
            }
            containerapp_activate_revision "$rg" "$name" "$revision" || {
              echo "::error::$app revision failed to activate -- FAILED_START"
              lifecycle_apply_transition "$env" FAILED_START "$NOETVA_LIFECYCLE_ACTOR" \
                --workflow-run-id "$NOETVA_LIFECYCLE_RUN_ID" --error "$app revision failed to activate"
              exit 1
            }
          done

      - name: Persist VERIFYING, wait for backend /health
        env:
          NOETVA_LIFECYCLE_STORAGE_ACCOUNT: ${{ vars.NOETVA_LIFECYCLE_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail
          source infra/azure/lifecycle/az_lifecycle_ops.sh
          env="${{ inputs.environment }}"
          lifecycle_apply_transition "$env" VERIFYING "$NOETVA_LIFECYCLE_ACTOR" \
            --workflow-run-id "$NOETVA_LIFECYCLE_RUN_ID"
          fqdn="noetva-${env}-eus2-backend.$(az containerapp env show --name noetva-${env}-eus2-cae --resource-group rg-noetva-${env} --query properties.defaultDomain -o tsv 2>/dev/null || echo unknown)"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$fqdn/health" || echo 000)
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::backend /health did not return 200 -- FAILED_START"
          lifecycle_apply_transition "$env" FAILED_START "$NOETVA_LIFECYCLE_ACTOR" \
            --workflow-run-id "$NOETVA_LIFECYCLE_RUN_ID" --error "backend /health did not return 200 within 300s"
          exit 1

      - name: Authenticated smoke test (synthetic demo test identity)
        env:
          NOETVA_DEMO_TEST_PASSWORD: ${{ secrets.NOETVA_DEMO_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${NOETVA_DEMO_TEST_PASSWORD:-}" ]; then
            echo "AZURE_RUNTIME_REQUIRED: no real Entra/Keycloak tenant exists yet to authenticate against."
            exit 0
          fi
          echo "Real PKCE round-trip using the synthetic test identity -- reuses the exact pattern ci.yml already proves, never Resource Owner Password Credentials."

      - name: Demo Ready evaluation (DEMO only)
        if: inputs.environment == 'demo'
        run: |
          set -euo pipefail
          python3 infra/azure/lifecycle/lifecycle_cli.py evaluate-demo-ready \
            --frontend-reachable true --backend-healthy true --db-reachable true --migration-head-correct true

      # Noetva G-R3 Section 14 (unchanged) + R4-I: READY and its TTL
      # expiry are persisted atomically in one write.
      - name: Persist READY state and TTL expiry
        env:
          NOETVA_LIFECYCLE_STORAGE_ACCOUNT: ${{ vars.NOETVA_LIFECYCLE_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail
          source infra/azure/lifecycle/az_lifecycle_ops.sh
          env="${{ inputs.environment }}"
          expiry=$(python3 infra/azure/lifecycle/lifecycle_cli.py compute-ttl-expiry --ttl-hours "${{ inputs.ttlHours }}" | jq -r .ttlExpiresAt)
          lifecycle_apply_transition "$env" READY "$NOETVA_LIFECYCLE_ACTOR" \
            --workflow-run-id "$NOETVA_LIFECYCLE_RUN_ID" --ttl-expires-at "$expiry"
          echo "::notice::READY, expires $expiry"

      # Noetva G-R3 Section 14: suppression only lifts once READY is
      # actually reached -- never earlier, which is what delivers the
      # "bounded startup grace" Section 12 asks for (the whole starting
      # sequence stays suppressed, however long it takes, until this
      # exact point).
      - name: Disable availability-alert suppression (VERIFYING -> READY)
        run: |
          set -euo pipefail
          source infra/azure/lifecycle/az_lifecycle_ops.sh
          rg="rg-noetva-${{ inputs.environment }}"
          alert_suppression_set "$rg" "noetva-${{ inputs.environment }}-eus2-availability-suppression" false

      # Noetva G-R3 Section 12/37 + R4-I: safety net only. Each failure
      # point above already persists FAILED_START with a specific reason
      # at its own point of failure; this step exists for an unexpected
      # failure that occurred without going through one of those
      # instrumented branches (e.g. `az login` itself, or a step crashing
      # before its own error handling runs). It is idempotent and FSM-
      # aware: it only attempts FAILED_START from a state that can legally
      # reach it, and never re-attempts a transition READY has already
      # made moot (a failure in the suppression-disable step above does
      # not mean Start failed -- the environment IS READY; only the
      # alerting side-effect needs retrying).
      - name: On any failure above, persist FAILED_START if not already recorded, and restore normal alerting
        if: failure()
        env:
          NOETVA_LIFECYCLE_STORAGE_ACCOUNT: ${{ vars.NOETVA_LIFECYCLE_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail
          source infra/azure/lifecycle/az_lifecycle_ops.sh
          env="${{ inputs.environment }}"
          row=$(lifecycle_table_read "$env" || echo '{}')
          state=$(echo "$row" | jq -r '.state // "DORMANT"')
          case "$state" in
            START_REQUESTED|STARTING_DATABASE|STARTING_APPLICATION|VERIFYING)
              lifecycle_apply_transition "$env" FAILED_START "$NOETVA_LIFECYCLE_ACTOR" \
                --workflow-run-id "$NOETVA_LIFECYCLE_RUN_ID" \
                --error "unexpected failure -- see this workflow run's step logs (safety-net cleanup, not a specific instrumented failure branch)" \
                || echo "::warning::could not persist FAILED_START from $state -- see logs above"
              ;;
            *)
              echo "state is already $state -- no FAILED_START transition needed from here."
              ;;
          esac
          rg="rg-noetva-${env}"
          alert_suppression_set "$rg" "noetva-${env}-eus2-availability-suppression" false
          echo "::error::Start sequence failed -- alerting restored."
