services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ctec}
      POSTGRES_USER: ${POSTGRES_USER:-ctec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctec}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local/demo-only reference OIDC identity provider (PAD-002,
  # architecture/released/v1.10/). Never used in production; production
  # CTEC authentication remains the existing provider-neutral OIDC/JWKS
  # verifier pointed at whatever real issuer is configured via
  # CTEC_OIDC_ISSUER/CTEC_OIDC_AUDIENCE/CTEC_OIDC_JWKS_URL.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      # PAD-002 SS7: canonical issuer is the browser-visible localhost
      # address. This is the exact string embedded in every issued token's
      # "iss" claim and is what CTEC_OIDC_ISSUER must match byte-for-byte.
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
      # Local Keycloak admin console bootstrap credentials -- never a real
      # secret, but still required with no baked-in default, matching the
      # CTEC_RUNTIME_HANDOFF_KEY pattern below.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${CTEC_KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${CTEC_KEYCLOAK_ADMIN_PASSWORD:?Set CTEC_KEYCLOAK_ADMIN_PASSWORD in your .env — local Keycloak admin bootstrap only, never a real secret}
    ports: ["8081:8080"]
    volumes:
      - ./keycloak/ctec-realm.json:/opt/keycloak/data/import/ctec-realm.json:ro
    healthcheck:
      # No curl/wget in this image; /bin/sh is bash on this base image, so
      # /dev/tcp is a real HTTP-level check, not just a TCP-open probe.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/CTEC/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot bootstrap: sets ctec-demo-user's password from the caller's own
  # environment (PAD-002 SS13 fallback mechanism 2 -- Keycloak 26.0.8 does
  # not substitute ${env.VAR} placeholders inside realm-import user
  # credentials, empirically confirmed during Gate E Phase 1). Never
  # baked into the realm JSON; never logged; idempotent (kcadm.sh
  # set-password overwrites, never duplicates).
  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.0
    entrypoint: ["/bin/bash", "/opt/keycloak/bootstrap-demo-user.sh"]
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KC_BOOTSTRAP_ADMIN_USERNAME: ${CTEC_KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${CTEC_KEYCLOAK_ADMIN_PASSWORD:?Set CTEC_KEYCLOAK_ADMIN_PASSWORD in your .env — local Keycloak admin bootstrap only, never a real secret}
      CTEC_DEMO_USER_PASSWORD: ${CTEC_DEMO_USER_PASSWORD:?Set CTEC_DEMO_USER_PASSWORD in your .env — local Keycloak demo-user bootstrap only, never a real secret}
    volumes:
      - ./keycloak/bootstrap-demo-user.sh:/opt/keycloak/bootstrap-demo-user.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      CTEC_ENVIRONMENT: ${CTEC_ENVIRONMENT:-development}
      CTEC_LOG_LEVEL: ${CTEC_LOG_LEVEL:-INFO}
      CTEC_CORS_ORIGINS: ${CTEC_CORS_ORIGINS:-["http://localhost:3000"]}
      CTEC_DATABASE_URL: ${CTEC_DATABASE_URL:-postgresql+psycopg://ctec:ctec@postgres:5432/ctec}
      # Required for Supplier Risk submission (not required for the
      # read-only Ontology Studio, which has no auth dependency). See
      # README/runbook: these have no safe baked-in default because they
      # point at a real OIDC issuer for your environment.
      CTEC_OIDC_ISSUER: ${CTEC_OIDC_ISSUER:-}
      CTEC_OIDC_AUDIENCE: ${CTEC_OIDC_AUDIENCE:-}
      CTEC_OIDC_JWKS_URL: ${CTEC_OIDC_JWKS_URL:-}
      # Required for the ontology and supplier-risk persistence layer to
      # activate at all. Generate your own — never share or commit a real
      # value. There is intentionally no baked-in default: a fixed key
      # checked into a compose file defeats its purpose.
      # python3 -c "import secrets,base64;print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())"
      CTEC_RUNTIME_HANDOFF_KEY: ${CTEC_RUNTIME_HANDOFF_KEY:?Set CTEC_RUNTIME_HANDOFF_KEY in your .env — see docker-compose.yml comments for how to generate one}
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_CTEC_API_ORIGIN: ${NEXT_PUBLIC_CTEC_API_ORIGIN:-http://localhost:8000}
        NEXT_PUBLIC_OIDC_AUTHORITY: ${NEXT_PUBLIC_OIDC_AUTHORITY:-}
        NEXT_PUBLIC_OIDC_CLIENT_ID: ${NEXT_PUBLIC_OIDC_CLIENT_ID:-}
        NEXT_PUBLIC_OIDC_REDIRECT_URI: ${NEXT_PUBLIC_OIDC_REDIRECT_URI:-}
        NEXT_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI: ${NEXT_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI:-}
        # Passthrough only -- frontend/lib/auth/config.ts's code-level
        # default remains the single canonical scope authority (PAD-002
        # SS15). Empty when unset; do not add a value here.
        NEXT_PUBLIC_OIDC_SCOPE: ${NEXT_PUBLIC_OIDC_SCOPE:-}
    ports: ["3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
